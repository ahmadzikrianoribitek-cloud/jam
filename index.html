  .content { width: var(--w); text-align: center; }
  .timer { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(var(--w) * .03); }
  .box {
    border: 1px solid rgba(255,255,255,.35); border-radius: 14px;
    background: rgba(0,0,0,.3);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    padding: calc(var(--w) * .06) 4px;
    box-shadow: 0 8px 32px rgba(0,0,0,.35);
  }
  .num {
    font-size: calc(var(--w) * .15); font-weight: 700; line-height: 1;
    font-variant-numeric: tabular-nums; text-shadow: 0 2px 12px rgba(0,0,0,.75), 0 0 3px rgba(0,0,0,.6);
  }
  .lbl {
    font-size: calc(var(--w) * .035); opacity: .9;
    margin-top: calc(var(--w) * .025); letter-spacing: .12em;
  }
  .date { margin-top: calc(var(--w) * .08); text-shadow: 0 2px 14px rgba(0,0,0,.9), 0 0 4px rgba(0,0,0,.8); }
  .day {
    display: flex; align-items: center; justify-content: center; gap: calc(var(--w) * .04);
    font-size: calc(var(--w) * .052); font-weight: 800;
    letter-spacing: .42em; padding-left: .42em; color: #fff;
  }
  .day::before, .day::after {
    content: ""; flex: 0 0 calc(var(--w) * .1); height: 1px;
    background: linear-gradient(90deg, transparent, #f5c451);
  }
  .day::after { background: linear-gradient(270deg, transparent, #f5c451); }
  .full {
    margin-top: calc(var(--w) * .035); white-space: nowrap;
    font-size: calc(var(--w) * .074); font-weight: 800;
    letter-spacing: .08em; line-height: 1.2; color: #f5c451;
  }

  /* Layar lebar / HP miring: foto penuh, jam di kiri agar kucing tetap terlihat */
  @media (orientation: landscape) {
    :root { --w: min(800px, 46vw, 112vh); }
    body { align-items: flex-start; justify-content: center; padding: 24px 0 24px clamp(20px, 6vw, 96px); }
    .bg {
      background-size: cover; background-position: 68% 50%;
      -webkit-mask-image: none; mask-image: none;
    }
    .bg::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(90deg, rgba(0,0,0,.7) 0%, rgba(0,0,0,.35) 45%, rgba(0,0,0,0) 80%);
    }
  }

  /* Monitor kecepatan internet (realtime) */
  .net { margin-top: calc(var(--w) * .045); display: grid; grid-template-columns: repeat(2, 1fr); gap: calc(var(--w) * .03); cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  .nbox {
    border: 1px solid rgba(255,255,255,.35); border-radius: 14px;
    background: rgba(0,0,0,.3);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    padding: calc(var(--w) * .028) 4px calc(var(--w) * .032); box-shadow: 0 8px 32px rgba(0,0,0,.35);
    text-shadow: 0 2px 12px rgba(0,0,0,.75), 0 0 3px rgba(0,0,0,.6);
  }
  .nlbl { font-size: calc(var(--w) * .03); letter-spacing: .14em; opacity: .9; }
  .nval { font-size: calc(var(--w) * .085); font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; margin-top: calc(var(--w) * .008); }
  .nunit { font-size: calc(var(--w) * .03); font-weight: 400; opacity: .85; letter-spacing: .08em; margin-left: .25em; }
  .dl .nlbl b { color: #5ee08a; } .ul .nlbl b { color: #f5c451; }
  .npng { grid-column: 1 / -1; font-size: calc(var(--w) * .028); letter-spacing: .1em; opacity: .85; text-shadow: 0 2px 10px rgba(0,0,0,.9); }
  .net.off .nval { color: #ff7b7b; }
  .net.pause .nval { opacity: .45; }
</style>

<body>
  <div class="bg"></div>
  <div class="content">
    <div class="timer">
      <div class="box"><div class="num" id="hh">00</div><div class="lbl">JAM</div></div>
      <div class="box"><div class="num" id="mm">00</div><div class="lbl">MENIT</div></div>
      <div class="box"><div class="num" id="ss">00</div><div class="lbl">DETIK</div></div>
    </div>
    <div class="date"><div class="day" id="day"></div><div class="full" id="full"></div></div>
    <div class="net" id="net" title="Ketuk untuk jeda / lanjut">
      <div class="nbox dl"><div class="nlbl"><b>&#9660;</b> DOWNLOAD</div><div class="nval"><span id="dl">--</span><span class="nunit">Mbps</span></div></div>
      <div class="nbox ul"><div class="nlbl"><b>&#9650;</b> UPLOAD</div><div class="nval"><span id="ul">--</span><span class="nunit">Mbps</span></div></div>
      <div class="npng" id="png">PING -- ms</div>
    </div>
  </div>
<script>
  // Selalu memakai zona waktu Asia/Makassar (WITA, GMT+8), apa pun pengaturan perangkat
  var timeFmt = new Intl.DateTimeFormat("id-ID", {
    timeZone: "Asia/Makassar", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23"
  });
  var dateFmt = new Intl.DateTimeFormat("id-ID", {
    timeZone: "Asia/Makassar", weekday: "long", day: "numeric", month: "long", year: "numeric"
  });
  function tick(){
    var now = new Date();
    var p = {};
    timeFmt.formatToParts(now).forEach(function(x){ p[x.type] = x.value; });
    document.getElementById("hh").textContent = p.hour;
    document.getElementById("mm").textContent = p.minute;
    document.getElementById("ss").textContent = p.second;
    var d = {};
    dateFmt.formatToParts(now).forEach(function(x){ d[x.type] = x.value; });
    document.getElementById("day").textContent = d.weekday.toUpperCase();
    document.getElementById("full").textContent = (d.day + " " + d.month + " " + d.year).toUpperCase();
  }
  tick();
  setInterval(tick, 250);


  // Monitor kecepatan internet REALTIME (server uji: Cloudflare, mendukung CORS)
  // Cara kerja: download & upload berjalan terus-menerus, kecepatan dihitung dari byte yang lewat tiap 0,5 detik.
  // PERHATIAN: ini memakai kuota besar (sebesar kecepatan internet Anda). Ketuk kotak untuk jeda / lanjut.
  (function(){
    var BASE = "https://speed.cloudflare.com/";
    var net = document.getElementById("net"), elD = document.getElementById("dl"),
        elU = document.getElementById("ul"), elP = document.getElementById("png");
    var wantRun = true, running = false;
    try { if (localStorage.getItem("speedPaused") === "1") wantRun = false; } catch(e){}

    var dBytes = 0, uBytes = 0, tD = 0, tU = 0;          // byte periode ini & total sesi
    var lastT = 0, smD = 0, smU = 0, pingMs = null;
    var ctrl = null, xhr = null, timerSpeed = 0, timerPing = 0;
    var ulBlob = new Blob([new Uint8Array(4000000)]);
    function rnd(){ return "&r=" + Math.random().toString(36).slice(2); }
    function fmt(v){ return v >= 100 ? v.toFixed(0) : v.toFixed(1); }
    function mb(b){ return b >= 1e9 ? (b/1e9).toFixed(2) + " GB" : (b/1e6).toFixed(0) + " MB"; }

    function startDL(){
      if (!running) return;
      ctrl = new AbortController();
      fetch(BASE + "__down?bytes=100000000" + rnd(), {cache:"no-store", signal: ctrl.signal}).then(function(r){
        var rd = r.body.getReader();
        function pump(){
          return rd.read().then(function(x){
            if (x.done) { if (running) startDL(); return; }
            dBytes += x.value.length; tD += x.value.length;
            return pump();
          });
        }
        return pump();
      }).catch(function(){ if (running) setTimeout(startDL, 1000); });
    }
    function startUL(){
      if (!running) return;
      var last = 0;
      xhr = new XMLHttpRequest();
      xhr.open("POST", BASE + "__up" + "?" + rnd().slice(1));
      xhr.upload.onprogress = function(e){ var d = e.loaded - last; last = e.loaded; uBytes += d; tU += d; };
      xhr.onloadend = function(){ if (running) setTimeout(startUL, xhr.status === 200 ? 0 : 1000); };
      xhr.send(ulBlob);
    }
    function doPing(){
      if (!running) return;
      var t = performance.now();
      fetch(BASE + "__down?bytes=0" + rnd(), {cache:"no-store"}).then(function(r){ return r.arrayBuffer(); })
        .then(function(){ pingMs = performance.now() - t; }).catch(function(){ pingMs = null; });
    }
    function render(){
      if (!running) { return; }
      var now = performance.now(), dt = (now - lastT) / 1000; lastT = now;
      if (dt <= 0) return;
      var vd = dBytes * 8 / 1e6 / dt, vu = uBytes * 8 / 1e6 / dt;
      dBytes = 0; uBytes = 0;
      smD = smD * .4 + vd * .6; smU = smU * .4 + vu * .6;   // sedikit diperhalus agar angka tidak melompat
      if (!navigator.onLine) { net.className = "net off"; elD.textContent = elU.textContent = "OFF"; elP.textContent = "TIDAK ADA KONEKSI"; return; }
      net.className = "net";
      elD.textContent = fmt(smD); elU.textContent = fmt(smU);
      elP.textContent = "PING " + (pingMs == null ? "--" : Math.round(pingMs)) + " ms  \u00B7  " + mb(tD + tU) + " TERPAKAI";
    }
    function start(){
      if (running) return;
      running = true; dBytes = uBytes = 0; smD = smU = 0; lastT = performance.now(); net.className = "net";
      startDL(); startUL(); doPing();
      timerSpeed = setInterval(render, 500);
      timerPing = setInterval(doPing, 2000);
    }
    function stop(label){
      running = false;
      clearInterval(timerSpeed); clearInterval(timerPing);
      try { if (ctrl) ctrl.abort(); } catch(e){}
      try { if (xhr) xhr.abort(); } catch(e){}
      net.className = "net pause"; elD.textContent = elU.textContent = "--";
      elP.textContent = label;
    }
    net.addEventListener("click", function(){
      wantRun = !wantRun;
      try { localStorage.setItem("speedPaused", wantRun ? "0" : "1"); } catch(e){}
      if (wantRun) start(); else stop("DIJEDA \u00B7 KETUK UNTUK MULAI");
    });
    document.addEventListener("visibilitychange", function(){
      if (document.hidden) { if (running) stop("DIJEDA"); }
      else if (wantRun) start();
    });
    if (wantRun) start(); else stop("DIJEDA \u00B7 KETUK UNTUK MULAI");
  })();

  // Daftarkan service worker (butuh https atau localhost)
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
      // Minta browser agar cache tidak dihapus otomatis saat ruang penyimpanan menipis
      if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(function(){}); }
    });
  }
</script>
</body>
</html>
