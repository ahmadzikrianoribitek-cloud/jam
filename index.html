<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Jam WITA</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#000000"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
<meta name="apple-mobile-web-app-title" content="Jam WITA"/>
<link rel="icon" href="favicon.ico" sizes="any"/>
<link rel="icon" type="image/png" sizes="48x48" href="icons/icon-48.png"/>
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"/>
<meta name="msapplication-TileImage" content="icons/icon-144.png"/>
<meta name="msapplication-TileColor" content="#000000"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
<style>
  :root { --w: min(92vw, 620px); }
  html { background: #000; }
  html, body { height: 100%; margin: 0; color: #fff; overflow: hidden; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: max(8vh, 28px) 16px 24px; box-sizing: border-box;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }

  /* Latar: foto kucing (HP tegak: foto di bagian bawah, jam di atas) */
  .bg {
    position: fixed; inset: 0; z-index: -1;
    background: #000 url("icons/bg-kucing.jpg") no-repeat 68% 100% / auto 72%;
    -webkit-mask-image: linear-gradient(to bottom, transparent 27%, #000 52%);
            mask-image: linear-gradient(to bottom, transparent 27%, #000 52%);
  }

  .content { width: var(--w); text-align: center; }
  .timer { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(var(--w) * .03); }
  .box {
    border: 1px solid rgba(255,255,255,.4); border-radius: 14px;
    background: rgba(0,0,0,.5);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    padding: calc(var(--w) * .06) 4px;
    box-shadow: 0 6px 24px rgba(0,0,0,.45);
  }
  .num {
    font-size: calc(var(--w) * .15); font-weight: 700; line-height: 1;
    font-variant-numeric: tabular-nums; text-shadow: 0 2px 10px rgba(0,0,0,.6);
  }
  .lbl {
    font-size: calc(var(--w) * .035); opacity: .9;
    margin-top: calc(var(--w) * .025); letter-spacing: .12em;
  }
  .date {
    margin-top: calc(var(--w) * .07);
    font-size: calc(var(--w) * .068); font-weight: 800;
    letter-spacing: .06em; line-height: 1.3; color: #f5c451; text-wrap: balance;
    text-shadow: 0 2px 14px rgba(0,0,0,.9), 0 0 4px rgba(0,0,0,.8);
  }

  /* Layar lebar / HP miring: foto penuh, jam di kiri agar kucing tetap terlihat */
  @media (orientation: landscape) {
    :root { --w: min(560px, 46vw, 78vh * 1.3); }
    body { align-items: flex-start; justify-content: center; padding: 24px 0 24px clamp(20px, 6vw, 96px); }
    .bg {
      background-size: cover; background-position: 68% 50%;
      -webkit-mask-image: none; mask-image: none;
    }
    .bg::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(90deg, rgba(0,0,0,.7) 0%, rgba(0,0,0,.35) 45%, rgba(0,0,0,0) 80%);
    }
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="content">
    <div class="timer">
      <div class="box"><div class="num" id="hh">00</div><div class="lbl">JAM</div></div>
      <div class="box"><div class="num" id="mm">00</div><div class="lbl">MENIT</div></div>
      <div class="box"><div class="num" id="ss">00</div><div class="lbl">DETIK</div></div>
    </div>
    <div class="date" id="date"></div>
  </div>
<script>
  // Selalu memakai zona waktu Asia/Makassar (WITA, GMT+8), apa pun pengaturan perangkat
  var timeFmt = new Intl.DateTimeFormat("id-ID", {
    timeZone: "Asia/Makassar", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23"
  });
  var dateFmt = new Intl.DateTimeFormat("id-ID", {
    timeZone: "Asia/Makassar", weekday: "long", day: "numeric", month: "long", year: "numeric"
  });
  function tick(){
    var now = new Date();
    var p = {};
    timeFmt.formatToParts(now).forEach(function(x){ p[x.type] = x.value; });
    document.getElementById("hh").textContent = p.hour;
    document.getElementById("mm").textContent = p.minute;
    document.getElementById("ss").textContent = p.second;
    document.getElementById("date").textContent = dateFmt.format(now).toUpperCase();
  }
  tick();
  setInterval(tick, 250);

  // Daftarkan service worker (butuh https atau localhost)
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
</script>
</body>
</html>
